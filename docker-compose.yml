services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arcade
      POSTGRES_PASSWORD: arcade
      POSTGRES_DB: arcade
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # crea también la base de datos de los tests
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arcade']
      interval: 3s
      retries: 10

  app:
    build: .
    profiles: [full] # docker compose --profile full up  -> todo en contenedores
    environment:
      DATABASE_URL: postgres://arcade:arcade@db:5432/arcade
      JWT_SECRET: ${JWT_SECRET:-cambiame-en-produccion}
      CLIENT_ORIGIN: http://localhost:4000
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
